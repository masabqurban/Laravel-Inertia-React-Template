name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Generate typed routes
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer types:check

      - name: Lint & format (Vite+)
        run: npm run check

      - name: TypeScript
        run: npm run types:check

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            connection: sqlite
            db-name: ':memory:'
          - database: postgres
            connection: pgsql
            port: 5432
            db-name: testing
            username: laravel
          - database: mysql
            connection: mysql
            port: 3306
            db-name: testing
            # Parallel runs create one database per process, which needs root.
            username: root

    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U laravel -d testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: ${{ matrix.db-name }}
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Feature tests render the Blade shell, which reads the Vite manifest.
      - name: Build assets
        run: npm run build

      - name: Run tests
        run: php artisan test --parallel

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: laravel-inertia-react-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/app.sqlite \
            laravel-inertia-react-template:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/up && exit 0
            sleep 2
          done
          docker logs app
          exit 1
