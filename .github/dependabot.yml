version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      composer-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
      radix-ui:
        patterns: ['@radix-ui/*']
    ignore:
      # TypeScript majors change type checking; upgrade deliberately.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Vite+ pins its own Vite core through `overrides`; bump them together.
      - dependency-name: vite
      - dependency-name: vite-plus

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ['*']
